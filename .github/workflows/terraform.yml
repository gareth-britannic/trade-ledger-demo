name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test .NET
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.400"
      - name: Restore
        run: dotnet restore TradeLedger.sln
      - name: Build
        run: dotnet build TradeLedger.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test TradeLedger.sln --configuration Release --no-build

  lint:
    name: Lint and validate Terraform
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize local environment without a backend
        run: terraform -chdir=infra/envs/local init -backend=false -input=false -lockfile=readonly
      - name: Validate local environment
        run: terraform -chdir=infra/envs/local validate
      - name: Initialize AWS environment without a backend
        run: terraform -chdir=infra/envs/aws init -backend=false -input=false -lockfile=readonly
      - name: Validate AWS environment
        run: terraform -chdir=infra/envs/aws validate

  terraform-tests:
    name: Terraform test ${{ matrix.directory }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/modules/network
          - infra/modules/fill-queue
          - infra/modules/database
          - infra/modules/public-api-edge
          - infra/modules/api-service
          - infra/envs/aws

    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - name: Initialize without a backend
        run: terraform -chdir=${{ matrix.directory }} init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform -chdir=${{ matrix.directory }} validate
      - name: Run mocked-provider tests
        run: terraform -chdir=${{ matrix.directory }} test
