name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test .NET
    runs-on: ubuntu-latest
    env:
      MIN_LINE_COVERAGE: "90"
      MIN_BRANCH_COVERAGE: "90"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.400"
      - name: Restore
        run: dotnet restore TradeLedger.sln --locked-mode
      - name: Restore local tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build TradeLedger.sln --configuration Release --no-restore
      - name: Test with coverage
        run: >-
          dotnet test TradeLedger.sln
          --configuration Release
          --no-build
          --collect:"Code Coverage"
          --settings coverage.runsettings
          --results-directory TestResults
      - name: Merge coverage reports
        run: >-
          dotnet reportgenerator
          "-reports:TestResults/**/*.cobertura.xml"
          "-targetdir:TestResults/Merged"
          "-reporttypes:Cobertura"
      - name: Enforce coverage thresholds
        shell: bash
        run: |
          coverage_file="TestResults/Merged/Cobertura.xml"
          if [[ ! -f "$coverage_file" ]]; then
            echo "Coverage report was not generated."
            exit 1
          fi

          coverage_header="$(sed -n '/<coverage /{p;q;}' "$coverage_file")"
          if [[ "$coverage_header" =~ line-rate=\"([0-9.]+)\" ]]; then
            line_rate="${BASH_REMATCH[1]}"
          else
            echo "Line coverage was not present in $coverage_file."
            exit 1
          fi
          if [[ "$coverage_header" =~ branch-rate=\"([0-9.]+)\" ]]; then
            branch_rate="${BASH_REMATCH[1]}"
          else
            echo "Branch coverage was not present in $coverage_file."
            exit 1
          fi

          awk -v rate="$line_rate" -v minimum="$MIN_LINE_COVERAGE" 'BEGIN {
            actual = rate * 100
            printf "Line coverage: %.2f%% (minimum %.2f%%)\n", actual, minimum
            exit actual < minimum
          }'
          awk -v rate="$branch_rate" -v minimum="$MIN_BRANCH_COVERAGE" 'BEGIN {
            actual = rate * 100
            printf "Branch coverage: %.2f%% (minimum %.2f%%)\n", actual, minimum
            exit actual < minimum
          }'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: code-coverage
          path: |
            TestResults/**/*.cobertura.xml
            TestResults/Merged/Cobertura.xml
          if-no-files-found: error

  web:
    name: Build and test React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check generated API client drift
        run: npm run api:check
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test frontend with coverage
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build

  lint:
    name: Lint and validate Terraform
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Terraform init retry helper
        run: tests/scripts/terraform-init-tests.sh
      - name: Validate local service bindings
        run: >-
          docker compose config --format json |
          jq -e '[.services[].ports[]? | .host_ip] | (length > 0 and all(. == "127.0.0.1"))'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize local environment without a backend
        run: deploy/scripts/terraform-init.sh infra/envs/local -backend=false -input=false -lockfile=readonly
      - name: Validate local environment
        run: terraform -chdir=infra/envs/local validate
      - name: Initialize AWS environment without a backend
        run: deploy/scripts/terraform-init.sh infra/envs/aws -backend=false -input=false -lockfile=readonly
      - name: Validate AWS environment
        run: terraform -chdir=infra/envs/aws validate

  terraform-tests:
    name: Terraform test ${{ matrix.directory }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/modules/network
          - infra/modules/fill-queue
          - infra/modules/database
          - infra/modules/public-api-edge
          - infra/modules/api-service
          - infra/modules/processor-lambda
          - infra/envs/aws

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5
      - name: Initialize without a backend
        run: deploy/scripts/terraform-init.sh ${{ matrix.directory }} -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform -chdir=${{ matrix.directory }} validate
      - name: Run mocked-provider tests
        run: terraform -chdir=${{ matrix.directory }} test

  integrate:
    name: End-to-end and FIFO integration
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-2
      AWS_REGION: eu-west-2
      AWS_EC2_METADATA_DISABLED: "true"
      TRADE_LEDGER_RUN_LOCALSTACK_INTEGRATION: "1"
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.400"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5
      - name: Restore .NET dependencies and tools
        run: |
          dotnet restore TradeLedger.sln --locked-mode
          dotnet tool restore
      - name: Start Postgres and LocalStack and deploy the processor
        run: ./deploy/scripts/bootstrap-all.sh
      - name: Run end-to-end and FIFO integration tests
        run: >-
          dotnet test tests/TradeLedger.IntegrationTests/TradeLedger.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --filter "Category=External"
      - name: Capture local service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local services
        if: always()
        run: docker compose down --volumes
