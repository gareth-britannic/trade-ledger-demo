services:
  localstack:
    image: localstack/localstack:3.0
    environment:
      SERVICES: sqs,lambda,iam,sts,logs
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DEBUG: "0"
      LAMBDA_DOCKER_NETWORK: trade-ledger-local
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - trade-ledger-local

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trade_ledger
      POSTGRES_USER: trade_ledger
      POSTGRES_PASSWORD: trade_ledger
    ports:
      - "${TRADE_LEDGER_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_ledger -d trade_ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - trade-ledger-local

  cognito-local:
    image: jagregory/cognito-local:5.3.0
    ports:
      - "9229:9229"
    environment:
      AWS_REGION: eu-west-2
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9229/health',response=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - cognito-data:/app/.cognito
      - ./infra/local/cognito/config.json:/app/.cognito/config.json
    networks:
      - trade-ledger-local

volumes:
  postgres-data:
  cognito-data:

networks:
  trade-ledger-local:
    name: trade-ledger-local
